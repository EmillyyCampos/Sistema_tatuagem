
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos — Estúdio de Tatuagem</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            color: #292330;
            background:
                linear-gradient(
                    rgba(244, 240, 247, 0.82),
                    rgba(232, 222, 241, 0.86)
                ),
                url("./img/fundo-tattoo.png") center center / cover fixed no-repeat;
        }

        /* Barra de navegação */
        .navbar {
            background-color: #30243d;
            padding: 13px 25px;
            box-shadow: 0 3px 12px rgba(48, 36, 61, 0.15);
        }

        .navbar .container {
            max-width: 1200px;
        }

        .navbar-brand {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .navbar-brand:hover {
            color: #d8baff;
        }
        

        .navbar-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .navbar-links a {
            color: #f5effb;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .navbar-links a:hover {
            color: #d8baff;
        }

        nav.navbar a.nav-link {
    font-size: 18px !important;
}

        .btn-sair {
            background-color: #7952a3;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 7px 13px;
            font-size: 12px;
            transition: 0.2s;
        }

        .btn-sair:hover {
            background-color: #593879;
            color: white;
        }

        /* Conteúdo */
        .container-pagina {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 22px;
        }

        .titulo {
            color: #49345e;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .subtitulo {
            color: #81758b;
            font-size: 14px;
            margin-bottom: 27px;
        }

        /* Formulário */
        .card-formulario {
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #e6dcec;
            border-radius: 13px;
            padding: 25px;
            margin-bottom: 27px;
            box-shadow: 0 5px 18px rgba(48, 36, 61, 0.07);
        }

        .titulo-formulario {
            color: #49345e;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-label {
            color: #49345e;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 7px;
        }

        .form-control,
        .form-select {
            border: 1px solid #ded2e8;
            border-radius: 7px;
            padding: 11px 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #292330;
            background-color: #fff;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #a783c7;
            box-shadow: 0 0 0 3px rgba(121, 82, 163, 0.12);
        }

        textarea.form-control {
            min-height: 90px;
            resize: vertical;
        }

        input[type="file"].form-control {
            padding: 8px;
            font-size: 12px;
        }

        input[type="file"]::file-selector-button {
            border: none;
            border-radius: 5px;
            background-color: #e9dff2;
            color: #49345e;
            padding: 7px 10px;
            margin-right: 10px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Botão de cadastro */
        .btn-cadastrar {
            background-color: #7952a3;
            border: none;
            border-radius: 7px;
            padding: 11px 13px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: white;
            transition: 0.2s;
        }

        .btn-cadastrar:hover {
            background-color: #593879;
            color: white;
        }

        /* Tabela */
        .card-tabela {
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #e6dcec;
            border-radius: 13px;
            padding: 22px;
            box-shadow: 0 5px 18px rgba(48, 36, 61, 0.07);
        }

        .titulo-tabela {
            color: #49345e;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .tabela-responsiva {
            width: 100%;
            overflow-x: auto;
        }

        .table {
            margin-bottom: 0;
            vertical-align: middle;
            font-size: 15px;
            white-space: nowrap;
        }

        .table thead th {
            background-color: #49345e;
            color: white;
            font-weight: 500;
            padding: 15px 11px;
            border-color: #6b5480;
        }

        .table tbody td {
            padding: 12px 11px;
            color: #51465c;
            border-color: #eee5f3;
        }

        .table tbody tr:nth-child(even) td {
            background-color: #faf7fc;
        }

        .table tbody tr:hover td {
            background-color: #f0e7f7;
        }

        .table img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 7px;
        }

        /* Botões de ação da tabela */
        .table .btn {
            font-size: 12px;
            padding: 6px 9px;
            border-radius: 5px;
        }

        /* Responsividade */
        @media (max-width: 992px) {
            .navbar-links {
                gap: 10px;
            }

            .navbar-links a {
                font-size: 11px;
            }
        }

        @media (max-width: 768px) {
            .navbar .container {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .navbar-links {
                width: 100%;
            }

            .container-pagina {
                margin-top: 25px;
                padding: 0 14px;
            }

            .titulo {
                font-size: 24px;
            }

            .card-formulario,
            .card-tabela {
                padding: 17px;
            }
        }

        @media (max-width: 480px) {
            .navbar-links {
                gap: 12px;
            }

            .titulo {
                font-size: 25px;
            }

            .subtitulo {
                font-size: 15px;
            }

            .titulo-formulario,
            .titulo-tabela {
                font-size: 23px;
            }

            .form-control,
            .form-select {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-stars"></i>
                Estúdio de Tatuagem
            </a>

            <div class="navbar-links">
                <a href="clientes.html">Clientes</a>
                <a href="senioridade.html">Senioridade</a>
                <a href="estilos.html">Estilos</a>
                <a href="tatuadores.html">Tatuadores</a>
                <a href="agendamentos.html">Agendamentos</a>

                <button onclick="sair()" class="btn btn-sair">
                    <i class="bi bi-box-arrow-right"></i>
                    Sair
                </button>
            </div>

        </div>
    </nav>

    <main class="container-pagina">

        <h1 class="titulo">
            <i class="bi bi-calendar-heart"></i>
            Agendamentos
        </h1>

        <p class="subtitulo">
            Organize os horários, os clientes e os atendimentos do estúdio.
        </p>

        <section class="card-formulario">

            <h2 class="titulo-formulario">
                <i class="bi bi-plus-circle"></i>
                Cadastro de agendamento
            </h2>

            <form id="form-agendamento" class="row g-3 mt-1">

                <div class="col-md-3">
                    <label for="idcliente" class="form-label">Cliente</label>
                    <select id="idcliente" class="form-select" required>
                        <option value="">Selecione o cliente...</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="idtatuador" class="form-label">Tatuador</label>
                    <select id="idtatuador" class="form-select" required>
                        <option value="">Selecione o tatuador...</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label for="dataagendamento" class="form-label">Data</label>
                    <input type="date" id="dataagendamento"
                           class="form-control" required>
                </div>

                <div class="col-md-2">
                    <label for="horaagendamento" class="form-label">Horário</label>
                    <input type="time" id="horaagendamento"
                           class="form-control" required>
                </div>

                <div class="col-md-2">
                    <label for="valortatuagem" class="form-label">Valor (R$)</label>
                    <input type="number" id="valortatuagem"
                           class="form-control" placeholder="0,00"
                           step="0.01" min="0">
                </div>

                <div class="col-md-8">
                    <label for="descricaotatuagem" class="form-label">
                        Descrição da tatuagem
                    </label>
                    <textarea id="descricaotatuagem" class="form-control"
                              placeholder="Descreva a tatuagem..."></textarea>
                </div>

                <div class="col-md-4">
                    <label for="desenho" class="form-label">
                        Desenho aprovado (imagem)
                    </label>
                    <input type="file" id="desenho"
                           class="form-control" accept="image/*">
                </div>

                <div class="col-md-3" id="bloco-status" style="display: none;">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" class="form-select">
                        <option value="pendente">Pendente</option>
                        <option value="confirmado">Confirmado</option>
                        <option value="concluido">Concluído</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button id="btn-submit-agendamento" type="submit"
                            class="btn btn-cadastrar w-100">
                        <i class="bi bi-plus-lg"></i>
                        Cadastrar agendamento
                    </button>
                </div>

            </form>
        </section>

        <section class="card-tabela">

            <h2 class="titulo-tabela">
                <i class="bi bi-list-ul"></i>
                Agendamentos cadastrados
            </h2>

            <div class="tabela-responsiva">
                <table class="table table-bordered">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Tatuador</th>
                            <th>Data</th>
                            <th>Hora</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Desenho</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="corpo-tabela">
                        <!-- Os agendamentos serão carregados pelo JavaScript -->
                    </tbody>

                </table>
            </div>
        </section>

    </main>

    <script src="js/auth.js"></script>
    <script src="js/agendamentos.js"></script>

</body>
</html>

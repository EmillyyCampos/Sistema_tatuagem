
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Estúdio de Tatuagem</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background:
        linear-gradient(rgba(244, 240, 247, 0.72), rgba(244, 240, 247, 0.82)),
        url("img/fundo-tattoo.png") center center / cover no-repeat fixed;
      color: #292330;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .cadastro {
      background-color: rgba(255, 255, 255, 0.94);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 14px;
      border: 1px solid rgba(216, 186, 255, 0.6);
      box-shadow: 0 8px 30px rgba(48, 36, 61, 0.15);
    }

    h1 {
      color: #49345e;
      font-weight: 700;
      text-align: center;
    }

    .subtitulo {
      color: #81758b;
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-control {
      padding: 12px;
      border: 1px solid #d8cce3;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
    }

    .form-control:focus {
      border-color: #7952a3;
      box-shadow: 0 0 0 0.2rem rgba(121, 82, 163, 0.15);
    }

    .btn-primary {
      background-color: #7952a3;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background-color: #593879;
      transform: translateY(-2px);
    }

    p {
      color: #6b6173;
      font-size: 14px;
    }

    a {
      color: #7952a3;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      color: #593879;
      text-decoration: underline;
    }

    @media (max-width: 576px) {
      .cadastro {
        padding: 30px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="cadastro">
    <h1 class="mb-2">Criar conta</h1>

    <p class="subtitulo">
      Faça seu cadastro para começar.
    </p>

    <form id="form-cadastro">
      <div class="mb-3">
        <input type="text" id="nome" class="form-control"
          placeholder="Nome" required>
      </div>

      <div class="mb-3">
        <input type="email" id="email" class="form-control"
          placeholder="E-mail" required>
      </div>

      <div class="mb-3">
        <input type="password" id="senha" class="form-control"
          placeholder="Senha" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Cadastrar
      </button>
    </form>

    <p class="mt-4 mb-0 text-center">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
